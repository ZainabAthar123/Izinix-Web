    const { useRef, useEffect, useState } = React;

    /* ─── Magnet ─────────────────────────────────────────────────────────── */
    function Magnet({ children, padding = 150, strength = 3,
      activeTransition = 'transform 0.3s ease-out',
      inactiveTransition = 'transform 0.6s ease-in-out' }) {
      const ref = useRef(null);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const [active, setActive] = useState(false);
      useEffect(() => {
        const onMove = (e) => {
          const el = ref.current; if (!el) return;
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const inside = e.clientX >= r.left - padding && e.clientX <= r.right + padding
            && e.clientY >= r.top - padding && e.clientY <= r.bottom + padding;
          if (inside) { setActive(true); setPos({ x: (e.clientX - cx) / strength, y: (e.clientY - cy) / strength }); }
          else { setActive(false); setPos({ x: 0, y: 0 }); }
        };
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, [padding, strength]);
      return (
        <div ref={ref} style={{ transform: `translate3d(${pos.x}px,${pos.y}px,0)`, transition: active ? activeTransition : inactiveTransition, willChange: 'transform' }}>
          {children}
        </div>
      );
    }

    /* ─── FadeIn ─────────────────────────────────────────────────────────── */
    function FadeIn({ children, delay = 0, duration = 0.7, x = 0, y = 30, className, style, ...rest }) {
      return (
        <motion.div
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
          className={className} style={style} {...rest}
        >{children}</motion.div>
      );
    }

    /* ─── AnimChar ───────────────────────────────────────────────────────── */
    function AnimChar({ char, progress, index, total }) {
      const start = index / total, end = (index + 1) / total;
      const opacity = useTransform(progress, [start, end], [0.2, 1]);
      return (
        <span style={{ position: 'relative', display: 'inline', whiteSpace: 'pre' }}>
          <span style={{ visibility: 'hidden' }}>{char}</span>
          <motion.span style={{ opacity, position: 'absolute', left: 0, top: 0 }}>{char}</motion.span>
        </span>
      );
    }

    /* ─── AnimatedText ───────────────────────────────────────────────────── */
    function AnimatedText({ text, className, style }) {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });

      return (

          {chars.map((c, i) => <AnimChar key={i} char={c} progress={scrollYProgress} index={i} total={chars.length} />)}

      );
    }

      const { scrollYProgress } = useScroll({ target: containerRef, offset: ['start start', 'end start'] });
      const targetScale = 1 - (totalCards - 1 - index) * 0.03;
      const scale = useTransform(scrollYProgress, [0, 1], [1, targetScale]);
      const stickyTop = 96 + index * 28;

      return (
        <div ref={containerRef} style={{ height: '85vh' }}>
          <motion.div style={{
            scale, position: 'sticky', top: stickyTop, willChange: 'transform',
            transformOrigin: 'top center', background: '#0C0C0C',
            border: '2px solid #D7E2EA', overflow: 'hidden',
          }} className="rounded-[40px] sm:rounded-[50px] md:rounded-[60px] p-4 sm:p-6 md:p-8">

            {/* Top row */}
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '1rem' }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: '1rem' }}>
                <span className="hero-heading font-black" style={{ fontSize: 'clamp(3rem, 10vw, 140px)', lineHeight: 1 }}>
                  {project.num}
                </span>
                <div style={{ display: 'flex', flexDirection: 'column', paddingTop: '0.5rem' }}>
                  <span style={{ color: '#D7E2EA', opacity: 0.6, fontSize: 'clamp(0.75rem, 1.2vw, 1rem)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                    {project.category}
                  </span>
                  <span className="font-medium uppercase" style={{ color: '#D7E2EA', fontSize: 'clamp(1rem, 2vw, 1.8rem)', letterSpacing: '0.05em' }}>
                    {project.name}
                  </span>
                </div>
              </div>
              <LiveProjectButton />
            </div>

            {/* Bottom image grid */}
            <div style={{ display: 'flex', gap: '0.75rem' }}>
              {/* Left col — 40% */}
              <div style={{ width: '40%', display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                <img src={project.col1[0]} alt="" loading="lazy" style={{ width: '100%', height: 'clamp(130px, 16vw, 230px)', objectFit: 'cover', borderRadius: imgBR, display: 'block' }} />
                <img src={project.col1[1]} alt="" loading="lazy" style={{ width: '100%', height: 'clamp(160px, 22vw, 340px)', objectFit: 'cover', borderRadius: imgBR, display: 'block' }} />
              </div>
              {/* Right col — 60% */}
              <div style={{ width: '60%' }}>
                <img src={project.col2} alt="" loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: imgBR, display: 'block' }} />
              </div>
            </div>

          </motion.div>
        </div>
      );
    }

    function ProjectsSection() {
      return (
        <section style={{ background: '#0C0C0C', position: 'relative', zIndex: 10 }}
          className="rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 px-5 sm:px-8 md:px-10 pt-20 sm:pt-24 md:pt-32 pb-20">
          <FadeIn delay={0} y={40}>
            <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center mb-16 sm:mb-20 md:mb-24"
              style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}>
              Project
            </h2>
          </FadeIn>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
            {PROJECTS.map((proj, i) => (
              <ProjectCard key={proj.num} project={proj} index={i} totalCards={PROJECTS.length} />
            ))}
          </div>
        </section>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       APP
    ══════════════════════════════════════════════════════════════════════════ */
    function App() {
      return (
        <div style={{ background: '#0C0C0C', overflowX: 'clip' }}>
          <HeroSection />
          <MarqueeSection />
          <AboutSection />
          <ServicesSection />
          <ProjectsSection />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
