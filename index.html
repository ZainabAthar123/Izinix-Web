  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Liquid Glass — subtle ─────────────────────────────────────────────── */
    .liquid-glass {

      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {

      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,

        rgba(255,255,255,0)    60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Liquid Glass — strong ─────────────────────────────────────────────── */
    .liquid-glass-strong {

    }
    .liquid-glass-strong::before {
      content: "";

      border-radius: inherit;
      padding: 1.4px;

        rgba(255,255,255,0.5) 0%,

        rgba(255,255,255,0)   40%,
        rgba(255,255,255,0)   60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);

<body>
  <div id="root"></div>

  <script type="text/babel">
    /* ── Suppress benign Framer Motion dev list-key warnings ─────────────── */
    const _origErr = console.error.bind(console);
    console.error = (...args) => {
      if (typeof args[0] === 'string' && (
        args[0].includes('Each child in a list') ||
        args[0].includes('unique "key"')
      )) return;
      _origErr(...args);
    };

    const { useRef, useEffect, useState } = React;
    const { motion } = Motion;

    /* ════════════════════════════════════════════════════════════════════════
       FadingVideo — looping video with rAF crossfade (no CSS transitions)
       ════════════════════════════════════════════════════════════════════════ */
    const FADE_MS       = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef    = useRef(null);
      const rafRef      = useRef(null);
      const fadingOutRef = useRef(false);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        /* fadeTo reads current opacity from video.style.opacity so each new
           fade resumes from wherever the last one left off.                  */
        function fadeTo(targetOpacity, durationMs) {
          cancelAnimationFrame(rafRef.current);
          const startTime    = performance.now();
          const startOpacity = parseFloat(video.style.opacity) || 0;

          function tick(now) {
            const elapsed  = now - startTime;
            const progress = Math.min(elapsed / durationMs, 1);
            video.style.opacity = String(
              startOpacity + (targetOpacity - startOpacity) * progress
            );
            if (progress < 1) rafRef.current = requestAnimationFrame(tick);
          }
          rafRef.current = requestAnimationFrame(tick);
        }

        function onLoadedData() {
          video.style.opacity = '0';
          video.play().catch(() => {});
          fadeTo(1, FADE_MS);
        }

        function onTimeUpdate() {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        }

        function onEnded() {
          video.style.opacity = '0';
          setTimeout(() => {
            video.currentTime  = 0;
            video.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        }

        video.style.opacity = '0';
        video.addEventListener('loadeddata', onLoadedData);
        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('ended',      onEnded);

        return () => {
          cancelAnimationFrame(rafRef.current);
          video.removeEventListener('loadeddata', onLoadedData);
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('ended',      onEnded);
        };
      }, [src]);

      /* loop is intentionally OFF — we implement looping manually via ended  */
      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay muted playsInline preload="auto"
          className={className}
          style={{ opacity: 0, ...style }}
        />
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       BlurText — word-by-word blur entrance, triggered by IntersectionObserver
       ════════════════════════════════════════════════════════════════════════ */
    function BlurText({ text, className }) {
      const containerRef = useRef(null);
      const [triggered, setTriggered] = useState(false);

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) { setTriggered(true); observer.disconnect(); }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <p
          ref={containerRef}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={triggered
                ? { filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                    opacity: [0, 0.5, 1],
                    y: [50, -5, 0] }
                : { filter: 'blur(10px)', opacity: 0, y: 50 }
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: 'easeOut',
                delay: (i * 100) / 1000,
              }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       Inline SVG icons (lucide-style, currentColor stroke)
       ════════════════════════════════════════════════════════════════════════ */

    /* ════════════════════════════════════════════════════════════════════════

            <span className="font-heading italic text-white text-xl leading-none select-none">a</span>

    /* ════════════════════════════════════════════════════════════════════════

          {/* z-10 content layer */}

            <Navbar />

            {/* ── Hero content (centred) ─────────────────────────────────── */}

              {/* Badge */}

                className="liquid-glass rounded-full flex items-center gap-2 px-2 py-1.5 mb-6">
                <span className="bg-white text-black px-3 py-1 rounded-full text-xs font-semibold font-body">
                  New

                <span className="text-sm text-white/90 font-body pr-3">
                  Maiden Crewed Voyage to Mars Arrives 2026
                </span>
              </motion.div>

              {/* Headline — word-by-word blur */}

              {/* Subheading */}

                className="mt-4 text-sm md:text-base text-white max-w-2xl font-body font-light leading-tight text-center">
                Discover the universe in ways once unimaginable. Our pioneering vessels and
                breakthrough engineering bring deep-space exploration within reach—secure and extraordinary.
              </motion.p>

              {/* CTA row */}

                </button>
              </motion.div>

              {/* Stats cards */}
              <motion.div {...fu(1.3)} className="flex items-stretch gap-4 mt-8">

                {/* Card 1 — clock */}
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col justify-between">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <div>
                    <div className="text-4xl font-heading italic text-white tracking-[-1px] leading-none">
                      34.5 Min
                    </div>
                    <div className="text-xs text-white font-body font-light mt-2">
                      Average Videos Watch Time
                    </div>
                  </div>
                </div>

                {/* Card 2 — globe */}
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col justify-between">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                  <div>
                    <div className="text-4xl font-heading italic text-white tracking-[-1px] leading-none">
                      2.8B+
                    </div>
                    <div className="text-xs text-white font-body font-light mt-2">
                      Users Across the Globe
                    </div>
                  </div>
                </div>

              </motion.div>
            </div>{/* /hero content */}

            {/* ── Partners row ──────────────────────────────────────────── */}
            <motion.div
              initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
              animate={{ filter: 'blur(0px)',  opacity: 1, y: 0  }}
              transition={{ ease: 'easeOut', duration: 0.7, delay: 1.4 }}
              className="flex flex-col items-center gap-4 pb-8"
            >
              <div className="liquid-glass rounded-full px-3.5 py-1">
                <span className="text-xs font-medium text-white font-body">
                  Collaborating with top aerospace pioneers globally
                </span>
              </div>
              <div className="flex items-center gap-12 md:gap-16">
                {['Aeon', 'Vela', 'Apex', 'Orbit', 'Zeno'].map(name => (
                  <span key={name}
                    className="font-heading italic text-white text-2xl md:text-3xl tracking-tight">
                    {name}
                  </span>
                ))}
              </div>
            </motion.div>

          </div>{/* /z-10 layer */}
        </section>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       Capabilities Section
       ════════════════════════════════════════════════════════════════════════ */
    const CAP_CARDS = [
      {
        /* image icon */
        iconPath: 'M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z',
        tags:  ['Natural Context', 'Photo Realism', 'Infinite Settings', 'Eco-Vibe'],
        title: 'AI Scenery',
        body:  'AI analyzes your product to create indistinguishable natural environments — from Icelandic cliffs to misty forests.',
      },
      {
        /* movie icon */
        iconPath: 'M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z',
        tags:  ['Scale Fast', 'Visual Consistency', 'Time Saver', 'Ready to Post'],
        title: 'Batch Production',
        body:  'Style your entire product line in minutes. Create a unified visual identity for catalogues and social media without weeks of retouching.',
      },
      {
        /* lightbulb icon */
        iconPath: 'M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z',
        tags:  ['Ray Tracing', 'Physical Shadows', 'Studio Quality', 'Sunlight Sync'],
        title: 'Smart Lighting',
        body:  'Automatic lighting and material adjustment. Achieve flawless integration with realistic shadows and sunlight.',
      },
    ];

    function CapabilitiesSection() {
      return (
        <section className="relative min-h-screen bg-black overflow-hidden">

          {/* Background video — full-bleed, no overlay */}
          <FadingVideo
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
            className="absolute inset-0 w-full h-full object-cover z-0"
          />

          <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen">

            {/* ── Header ──────────────────────────────────────────────── */}
            <div className="mb-auto">
              <p className="text-sm font-body text-white/80 mb-6">// Capabilities</p>
              <h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">
                Production<br/>evolved
              </h2>
            </div>

            {/* ── Cards grid ──────────────────────────────────────────── */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
              {CAP_CARDS.map((card, i) => (
                <div key={i} className="liquid-glass rounded-[1.25rem] p-6 min-h-[360px] flex flex-col">

                  {/* Top row: icon + tags */}
                  <div className="flex items-start justify-between gap-4">
                    <div className="liquid-glass w-11 h-11 rounded-[0.75rem] flex items-center justify-center flex-shrink-0">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="currentColor" className="h-6 w-6 text-white">
                        <path d={card.iconPath}/>
                      </svg>
                    </div>
                    <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                      {card.tags.map(tag => (
                        <span key={tag}
                          className="liquid-glass rounded-full px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Spacer */}
                  <div className="flex-1" />

                  {/* Bottom: title + body */}
                  <div className="mt-6">
                    <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">
                      {card.title}
                    </h3>
                    <p className="mt-3 text-sm text-white/90 font-body font-light leading-snug max-w-[32ch]">
                      {card.body}

                  </div>

                </div>

            </div>

          </div>
        </section>

    }

    /* ════════════════════════════════════════════════════════════════════════
       App root
       ════════════════════════════════════════════════════════════════════════ */
    function App() {
      return (
        <>
          <HeroSection />
          <CapabilitiesSection />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
