<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izinix</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       THEME TOKENS — change these to restyle the entire page instantly
       ═══════════════════════════════════════════════════════════════════════ */
    :root {
      /* Backgrounds */
      --color-bg:              #0a0a0a;
      --color-bg-section:      #0a0a0a;

      /* Text */
      --color-text-primary:    #ffffff;
      --color-text-muted:      #a1a1aa;
      --color-text-nav:        #d4d4d8;

      /* Accent (buttons, highlights) */
      --color-accent:          #ffffff;
      --color-accent-text:     #0a0a0a;
      --color-accent-border:   rgba(255, 255, 255, 0.6);

      /* Nav & structural */
      --color-nav-border:      rgba(255, 255, 255, 0.12);
      --color-section-border:  rgba(255, 255, 255, 0.08);

      /* Watermark ghost text */
      --color-watermark:       rgba(255, 255, 255, 0.05);

      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
    }

    /* ── Reset ────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; }

    /* ── Navbar ───────────────────────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--color-nav-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-primary);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .nav-logo .star { opacity: 0.45; font-size: 0.85rem; }

    .nav-links {
      display: flex;
      gap: 2px;
      border: 1px solid var(--color-nav-border);
      border-radius: 999px;
      padding: 6px 12px;
    }
    .nav-links a {
      color: var(--color-text-nav);
      font-size: 0.76rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      padding: 3px 10px;
      border-radius: 999px;
      transition: color 0.2s, background 0.2s;
    }
    .nav-links a:hover {
      color: var(--color-text-primary);
      background: rgba(255,255,255,0.06);
    }

    .nav-cta {
      background: var(--color-accent);
      color: var(--color-accent-text);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 9px 18px;
      border-radius: 999px;
      transition: opacity 0.2s;
    }
    .nav-cta:hover { opacity: 0.85; }

    /* ── Hero Section ─────────────────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
    }

    .hero-headline {
      font-size: clamp(3rem, 8.5vw, 7rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.03em;
      color: var(--color-text-primary);
      max-width: 840px;
      margin-bottom: 24px;
    }

    .hero-sub {
      font-size: clamp(0.82rem, 1.4vw, 0.96rem);
      color: var(--color-text-muted);
      max-width: 340px;
      line-height: 1.65;
      margin-bottom: 42px;
      letter-spacing: 0.01em;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-outline {
      border: 1px solid var(--color-accent-border);
      color: var(--color-text-primary);
      background: transparent;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 11px 24px;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-outline:hover { background: rgba(255,255,255,0.08); }

    .btn-filled {
      background: var(--color-accent);
      color: var(--color-accent-text);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 11px 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn-filled:hover { opacity: 0.85; }

    /* ── Quotation Section ────────────────────────────────────────────────── */
    .quotation {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 100px 6vw;
      background: var(--color-bg-section);
      border-top: 1px solid var(--color-section-border);
      position: relative;
      overflow: hidden;
    }

    /* Ghost / watermark brand name */
    .quotation-watermark {
      position: absolute;
      bottom: -0.14em;
      left: -0.03em;
      font-size: clamp(7rem, 21vw, 22rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--color-watermark);
      user-select: none;
      pointer-events: none;
      line-height: 1;
      white-space: nowrap;
    }

    .quotation-content {
      position: relative;
      z-index: 1;
      max-width: 900px;
    }

    .quotation-text {
      font-size: clamp(1.8rem, 4.5vw, 4.2rem);
      font-weight: 700;
      line-height: 1.14;
      letter-spacing: -0.025em;
      color: var(--color-text-primary);
      margin-bottom: 44px;
    }

    /* "innovative companies" — colored accent phrase */
    .quotation-text .accent {
      color: var(--color-text-primary); /* override this var to colorize */
    }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .nav { padding: 14px 20px; }
      .nav-links { display: none; }
      .quotation { padding: 80px 24px; }
    }
  </style>
</head>
<body>

  <!-- ── Navbar ───────────────────────────────────────────────────────────── -->
  <nav class="nav">
    <a href="#" class="nav-logo">
      <span class="star">✦</span> Izinix
    </a>

    <div class="nav-links">
      <a href="#services">Services</a>
      <a href="#process">Process</a>
      <a href="#team">Team</a>
      <a href="#pricing">Pricing</a>
      <a href="#faq">FAQ</a>
      <a href="#contact">Contact</a>
    </div>

    <a href="#contact" class="nav-cta">Get free template</a>
  </nav>

  <!-- ── Hero Section ─────────────────────────────────────────────────────── -->
  <section class="hero" id="hero">
    <h1 class="hero-headline">Izinix studio.</h1>
    <p class="hero-sub">
      We develop custom solutions for innovative companies.
    </p>
    <div class="hero-buttons">
      <a href="#services" class="btn-outline">our services</a>
      <a href="#contact" class="btn-filled">
        Contact us <span>→</span>
      </a>
    </div>
  </section>

  <!-- ── Quotation Section ─────────────────────────────────────────────────── -->
  <section class="quotation" id="about">
    <!-- Background watermark -->
    <span class="quotation-watermark" aria-hidden="true">Izinix</span>

    <!-- Foreground text -->
    <div class="quotation-content">
      <p class="quotation-text">
        We're Izinix. We develop custom<br>
        solutions for <span class="accent">innovative companies.</span>
      </p>
      <a href="#services" class="btn-outline">Learn more</a>
    </div>
  </section>

</body>
</html>
