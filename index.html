<!DOCTYPE html>

<head>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel (compiles JSX in the browser) -->

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useRef, useEffect, useState } = React;
    const { motion, useScroll, useTransform } = Motion;

    /* ══════════════════════════════════════════════════════════
       MAGNET  — mouse-following hover effect
    ══════════════════════════════════════════════════════════ */
    function Magnet({ children, padding = 150, strength = 3,
      activeTransition   = 'transform 0.3s ease-out',
      inactiveTransition = 'transform 0.6s ease-in-out' }) {

      const ref = useRef(null);
      const [pos, setPos]       = useState({ x: 0, y: 0 });
      const [active, setActive] = useState(false);

      useEffect(() => {
        const onMove = (e) => {
          const el = ref.current; if (!el) return;
          const r  = el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const inside = e.clientX >= r.left - padding && e.clientX <= r.right  + padding
                      && e.clientY >= r.top  - padding && e.clientY <= r.bottom + padding;
          if (inside) { setActive(true);  setPos({ x: (e.clientX - cx) / strength, y: (e.clientY - cy) / strength }); }
          else         { setActive(false); setPos({ x: 0, y: 0 }); }
        };
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, [padding, strength]);

      return (
        <div ref={ref} style={{ transform: `translate3d(${pos.x}px,${pos.y}px,0)`, transition: active ? activeTransition : inactiveTransition, willChange: 'transform' }}>
          {children}
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       FADEIN  — whileInView entrance animation
    ══════════════════════════════════════════════════════════ */
    function FadeIn({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = '', style = {} }) {
      return (
        <motion.div
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
          style={style}
        >{children}</motion.div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       ANIMATED TEXT  — character-by-character scroll reveal
    ══════════════════════════════════════════════════════════ */
    function AnimChar({ char, progress, index, total }) {
      const start   = index / total;
      const end     = (index + 1) / total;
      const opacity = useTransform(progress, [start, end], [0.2, 1]);
      return (
        <span style={{ position: 'relative', display: 'inline', whiteSpace: 'pre' }}>
          <span style={{ visibility: 'hidden' }}>{char}</span>
          <motion.span style={{ opacity, position: 'absolute', left: 0, top: 0 }}>{char}</motion.span>
        </span>
      );
    }

    function AnimatedText({ text, className = '', style = {} }) {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
      const chars = text.split('');
      return (
        <p ref={ref} className={className} style={{ position: 'relative', ...style }}>
          {chars.map((c, i) => <AnimChar key={i} char={c} progress={scrollYProgress} index={i} total={chars.length} />)}
        </p>
      );
    }

    /* ══════════════════════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════════════════════ */
    function ContactButton() {
      return <button className="btn-contact">Contact Me</button>;
    }

    function LiveProjectButton() {
      return <button className="btn-live">Live Project</button>;
    }

    /* ══════════════════════════════════════════════════════════
       1. HERO SECTION
    ══════════════════════════════════════════════════════════ */
    const NAV_LINKS = ['About', 'Price', 'Projects', 'Contact'];

    function HeroSection() {
      return (
        <section className="hero">
          {/* Navbar */}
          <FadeIn delay={0} y={-20}>
            <nav className="hero-nav">
              {NAV_LINKS.map(link => <a key={link} href="#">{link}</a>)}
            </nav>
          </FadeIn>

          {/* Heading */}
          <div className="hero-heading-wrap">
            <FadeIn delay={0.15} y={40}>
              <h1 className="hero-heading hero-h1">Hi, i&apos;m jack</h1>
            </FadeIn>
          </div>

          {/* Bottom bar */}
          <div className="hero-bottom">
            <FadeIn delay={0.35} y={20}>
              <p className="hero-desc">
                a 3d creator driven by crafting striking and unforgettable projects
              </p>
            </FadeIn>
            <FadeIn delay={0.5} y={20}>
              <ContactButton />
            </FadeIn>
          </div>

          {/* Portrait */}
          <div className="hero-portrait">
            <motion.div
              initial={{ opacity: 0, y: 30 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: 0.6, duration: 0.7, ease: [0.25, 0.1, 0.25, 1] }}
            >
              <Magnet padding={150} strength={3}>
                <img
                  src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png"
                  alt="Jack portrait"
                />
              </Magnet>
            </motion.div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════════════════════
       2. MARQUEE SECTION  — scroll-driven horizontal rows
    ══════════════════════════════════════════════════════════ */
    const MARQUEE_IMGS = [
      'https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif',
      'https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif',
      'https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif',
      'https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif',
      'https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif',
      'https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif',
      'https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif',
      'https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif',
      'https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif',
      'https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif',
      'https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif',
      'https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif',
      'https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif',
      'https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif',
      'https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif',
      'https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif',
      'https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif',
      'https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif',
      'https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif',
      'https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif',
      'https://motionsites.ai/assets/hero-celestia-preview-0yO3jXO8.gif',
    ];
    const ROW1 = [...MARQUEE_IMGS.slice(0,11), ...MARQUEE_IMGS.slice(0,11), ...MARQUEE_IMGS.slice(0,11)];
    const ROW2 = [...MARQUEE_IMGS.slice(11),   ...MARQUEE_IMGS.slice(11),   ...MARQUEE_IMGS.slice(11)];

    function MarqueeSection() {
      const sectionRef = useRef(null);
      const row1Ref    = useRef(null);
      const row2Ref    = useRef(null);

      useEffect(() => {
        const onScroll = () => {
          if (!sectionRef.current) return;
          const top    = sectionRef.current.getBoundingClientRect().top + window.scrollY;
          const offset = (window.scrollY - top + window.innerHeight) * 0.3;
          if (row1Ref.current) row1Ref.current.style.transform = `translateX(${offset - 200}px)`;
          if (row2Ref.current) row2Ref.current.style.transform = `translateX(${-(offset - 200)}px)`;
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <section ref={sectionRef} className="marquee-section">
          <div className="marquee-rows">
            <div ref={row1Ref} className="marquee-row">
              {ROW1.map((src, i) => <img key={i} src={src} alt="" loading="lazy" />)}
            </div>
            <div ref={row2Ref} className="marquee-row">
              {ROW2.map((src, i) => <img key={i} src={src} alt="" loading="lazy" />)}
            </div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════════════════════
       3. ABOUT SECTION
    ══════════════════════════════════════════════════════════ */
    const ABOUT_TEXT = "With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!";

    const DECO_IMGS = [
      { cls: 'about-deco about-deco--moon-tl', src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png',   delay: 0.10, dx: -80 },
      { cls: 'about-deco about-deco--obj-bl',  src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png',        delay: 0.25, dx: -80 },
      { cls: 'about-deco about-deco--lego-tr', src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png',  delay: 0.15, dx:  80 },
      { cls: 'about-deco about-deco--grp-br',  src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png',  delay: 0.30, dx:  80 },
    ];

    function AboutSection() {
      return (
        <section className="about-section">
          {DECO_IMGS.map(d => (
            <FadeIn key={d.cls} delay={d.delay} x={d.dx} y={0} duration={0.9} style={{ position: 'absolute' }} className={d.cls}>
              <img src={d.src} alt="" />
            </FadeIn>
          ))}

          <div className="about-center">
            <FadeIn delay={0} y={40}>
              <h2 className="hero-heading about-h2">About me</h2>
            </FadeIn>

            <div className="about-text-wrap">
              <AnimatedText text={ABOUT_TEXT} className="about-para" />
              <ContactButton />
            </div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════════════════════
       4. SERVICES SECTION
    ══════════════════════════════════════════════════════════ */
    const SERVICES = [
      { num: '01', name: '3D Modeling',   desc: 'Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations.' },
      { num: '02', name: 'Rendering',     desc: 'High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life.' },
      { num: '03', name: 'Motion Design', desc: 'Dynamic animations and motion graphics that add energy and storytelling to brands, products, and digital experiences.' },
      { num: '04', name: 'Branding',      desc: 'Crafting cohesive visual identities — from logos to full brand systems — that communicate a clear and memorable presence.' },
      { num: '05', name: 'Web Design',    desc: 'Designing clean, modern, and conversion-focused websites with attention to layout, typography, and user experience.' },
    ];

    function ServicesSection() {
      return (
        <section className="services-section">
          <FadeIn delay={0} y={40}>
            <h2 className="services-h2">Services</h2>
          </FadeIn>
          <div className="services-list">
            {SERVICES.map((svc, i) => (
              <FadeIn key={svc.num} delay={i * 0.1} y={30}>
                <div className="service-item">
                  <span className="service-num">{svc.num}</span>
                  <div className="service-info">
                    <span className="service-name">{svc.name}</span>
                    <span className="service-desc">{svc.desc}</span>
                  </div>
                </div>
              </FadeIn>
            ))}
            <div className="service-divider" />
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════════════════════
       5. PROJECTS SECTION  — sticky stacking cards
    ══════════════════════════════════════════════════════════ */
    const PROJECTS = [
      {
        num: '01', name: 'Nextlevel Studio', category: 'Client',
        col1: [
          'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1280&q=85',
          'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055431_11d841fd-8b41-46a5-82e4-b04f2407a7d8.png&w=1280&q=85',
        ],
        col2: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055451_e317bf2d-28d4-48cc-86b0-6f72f25b6327.png&w=1280&q=85',
      },
      {
        num: '02', name: 'Aura Brand Identity', category: 'Personal',
        col1: [
          'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055654_911201c5-36d9-4bc6-bac7-331adfce159f.png&w=1280&q=85',
          'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055723_5ceda0b8-d9c2-4665-b2e3-83ba19ba76d1.png&w=1280&q=85',
        ],
        col2: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055753_adc5dcbd-a8e6-49c0-b43a-9b030d835cea.png&w=1280&q=85',
      },
      {
        num: '03', name: 'Solaris Digital', category: 'Client',
        col1: [
          'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055759_963cfb0b-4bd1-4b0f-9d0a-09bd6cf95b2f.png&w=1280&q=85',
          'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_060108_438f781a-9846-4dcc-89ab-c4e6cb830f5b.png&w=1280&q=85',
        ],
        col2: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055818_9d062121-ad7e-46b9-999a-1a6a692ef1ee.png&w=1280&q=85',
      },
    ];

    function ProjectCard({ project, index, totalCards }) {
      const containerRef = useRef(null);
      const { scrollYProgress } = useScroll({ target: containerRef, offset: ['start start', 'end start'] });
      const targetScale  = 1 - (totalCards - 1 - index) * 0.03;
      const scale        = useTransform(scrollYProgress, [0, 1], [1, targetScale]);
      const stickyTop    = 96 + index * 28;

      return (
        <div ref={containerRef} className="card-container">
          <motion.div className="project-card" style={{ scale, top: stickyTop }}>
            <div className="card-top">
              <div className="card-top-left">
                <span className="hero-heading card-num">{project.num}</span>
                <div className="card-meta">
                  <span className="card-category">{project.category}</span>
                  <span className="card-name">{project.name}</span>
                </div>
              </div>
              <LiveProjectButton />
            </div>

            <div className="card-images">
              <div className="card-col1">
                <img src={project.col1[0]} alt="" loading="lazy" />
                <img src={project.col1[1]} alt="" loading="lazy" />
              </div>
              <div className="card-col2">
                <img src={project.col2} alt="" loading="lazy" />
              </div>
            </div>
          </motion.div>
        </div>
      );
    }

    function ProjectsSection() {
      return (
        <section className="projects-section">
          <FadeIn delay={0} y={40}>
            <h2 className="hero-heading projects-h2">Project</h2>
          </FadeIn>
          {PROJECTS.map((proj, i) => (
            <ProjectCard key={proj.num} project={proj} index={i} totalCards={PROJECTS.length} />
          ))}
        </section>
      );
    }

    /* ══════════════════════════════════════════════════════════
       APP ROOT
    ══════════════════════════════════════════════════════════ */
    function App() {
      return (
        <div style={{ background: '#0C0C0C', overflowX: 'clip' }}>
          <HeroSection />
          <MarqueeSection />
          <AboutSection />
          <ServicesSection />
          <ProjectsSection />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
