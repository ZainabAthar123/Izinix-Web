<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IZINIX — Where complexity ends.</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Instrument Serif', 'serif'],
            body:    ['Barlow', 'sans-serif'],

          borderRadius: {
            DEFAULT: '9999px',

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"

  <!-- Babel standalone -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>window.Motion = window.FramerMotion;</script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; }

    /* ── Liquid Glass — subtle ─────────────────────────────────────────────── */
    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0)    40%,
        rgba(255,255,255,0)    60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Liquid Glass — strong ─────────────────────────────────────────────── */
    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0)   40%,
        rgba(255,255,255,0)   60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /* ── Suppress benign Framer Motion dev list-key warnings ─────────────── */
    const _origErr = console.error.bind(console);
    console.error = (...args) => {
      if (typeof args[0] === 'string' && (
        args[0].includes('Each child in a list') ||
        args[0].includes('unique "key"')
      )) return;
      _origErr(...args);
    };

    const { useRef, useEffect, useState } = React;
    const { motion } = Motion;

    /* ════════════════════════════════════════════════════════════════════════
       fu — shared fade/blur-up entrance transition helper
       ════════════════════════════════════════════════════════════════════════ */
    const fu = (delay) => ({
      initial:    { filter: 'blur(10px)', opacity: 0, y: 20 },
      animate:    { filter: 'blur(0px)',  opacity: 1, y: 0  },
      transition: { ease: 'easeOut', duration: 0.7, delay   },
    });

    /* ════════════════════════════════════════════════════════════════════════
       GlassField — static dark background with blurred blobs + grid overlay
       (replaces the video treatment; no JS animation loop, cheap to render)
       ════════════════════════════════════════════════════════════════════════ */
    function GlassField() {
      return (
        <div className="fixed inset-0 z-0 bg-black overflow-hidden pointer-events-none">
          {/* Blurred structural blobs — cool blue-gray, off-canvas placement */}
          <div style={{
            position: 'absolute', top: '-15%', left: '-10%',
            width: '55vw', height: '55vw', maxWidth: '700px', maxHeight: '700px',
            borderRadius: '50%', background: 'rgba(120,140,170,0.12)', filter: 'blur(120px)',
          }} />
          <div style={{
            position: 'absolute', bottom: '-20%', right: '-15%',
            width: '60vw', height: '60vw', maxWidth: '760px', maxHeight: '760px',
            borderRadius: '50%', background: 'rgba(80,90,110,0.10)', filter: 'blur(120px)',
          }} />
          <div style={{
            position: 'absolute', top: '35%', left: '40%',
            width: '45vw', height: '45vw', maxWidth: '600px', maxHeight: '600px',
            borderRadius: '50%', background: 'rgba(120,140,170,0.12)', filter: 'blur(120px)',
          }} />
          <div style={{
            position: 'absolute', bottom: '10%', left: '-5%',
            width: '35vw', height: '35vw', maxWidth: '480px', maxHeight: '480px',
            borderRadius: '50%', background: 'rgba(80,90,110,0.10)', filter: 'blur(120px)',
          }} />

          {/* Faint grid overlay — reinforces the systems/infrastructure metaphor */}
          <div style={{
            position: 'absolute', inset: 0, opacity: 0.4,
            backgroundImage:
              'linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), ' +
              'linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px)',
            backgroundSize: '64px 64px, 64px 64px',
          }} />
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       BlurText — word-by-word blur entrance, triggered by IntersectionObserver
       ════════════════════════════════════════════════════════════════════════ */
    function BlurText({ text, className }) {
      const containerRef = useRef(null);
      const [triggered, setTriggered] = useState(false);

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) { setTriggered(true); observer.disconnect(); }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <p
          ref={containerRef}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={triggered
                ? { filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                    opacity: [0, 0.5, 1],
                    y: [50, -5, 0] }
                : { filter: 'blur(10px)', opacity: 0, y: 50 }
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: 'easeOut',
                delay: (i * 100) / 1000,
              }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       Inline SVG icons (lucide-style stroke + Material-style filled)
       ════════════════════════════════════════════════════════════════════════ */
    function ArrowUpRight({ className = '' }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M7 17L17 7"/>
          <path d="M7 7h10v10"/>
        </svg>
      );
    }

    function ArrowDown({ className = '' }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M12 5v14"/>
          <path d="M6 13l6 6 6-6"/>
        </svg>
      );
    }

    function PillarIcon({ path, className = '' }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
          fill="currentColor" className={className}>
          <path d={path} />
        </svg>
      );
    }

    const PILLAR_ICON_PATHS = {
      automation: 'M13 2 3 14h7l-1 8 10-12h-7l1-8Z',
      browser:    'M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm-1 5h18V6H3v3Zm2-2.2a.9.9 0 1 0 0-1.8.9.9 0 0 0 0 1.8Zm2.4 0a.9.9 0 1 0 0-1.8.9.9 0 0 0 0 1.8Z',
      smartphone: 'M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2Zm0 4v14h10V5H7Zm5 15.7a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z',
      server:     'M4 2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm3 4.4a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2ZM4 15h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Zm3 4.4a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2Z',
      megaphone:  'M3 10v4a2 2 0 0 0 2 2h1l3 4v-5.06c2.7.35 5.02 1.87 6 3.06V6c-.98 1.19-3.3 2.71-6 3.06V5L6 9H5a2 2 0 0 0-2 1Z',
    };

    /* ════════════════════════════════════════════════════════════════════════
       Navbar
       ════════════════════════════════════════════════════════════════════════ */
    const NAV_LINKS = [
      { label: 'Work',      view: 'home' },
      { label: 'Use Cases', view: 'use-cases' },
      { label: 'Contact',   view: 'contact' },
    ];

    function Navbar({ view, go }) {
      return (
        <nav className="fixed top-4 left-0 right-0 z-50 px-8 lg:px-16 flex items-center justify-between">
          {/* Logo + mobile wordmark */}
          <div className="flex items-center gap-3 flex-shrink-0">

              onClick={() => go('home')}>
              <span className="font-heading italic text-white text-xl leading-none select-none">i</span>
            </div>
            <span className="md:hidden tracking-widest text-sm text-white/90 font-body">IZINIX</span>
          </div>

          {/* Centre nav — desktop only */}
          <div className="hidden md:flex items-center liquid-glass rounded-full px-1.5 py-1.5">
            {NAV_LINKS.map(link => (
              <a key={link.label} href="#"
                onClick={(e) => { e.preventDefault(); go(link.view); }}

                {link.label}
              </a>
            ))}
            <button onClick={() => go('contact')}
              className="bg-white text-black px-4 py-2 rounded-full text-sm font-semibold font-body whitespace-nowrap flex items-center gap-1.5 ml-1 cursor-pointer">

          </div>

          {/* Invisible balance spacer */}
          <div className="w-12 h-12 flex-shrink-0" />
        </nav>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       Footer
       ════════════════════════════════════════════════════════════════════════ */
    function Footer({ go }) {
      return (
        <footer className="liquid-glass border-t-0 px-8 lg:px-16 py-10 mt-32">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
              <div className="font-heading italic text-white text-xl">IZINIX</div>
              <div className="text-xs text-white/50 font-body mt-1">Where complexity ends.</div>
            </div>

            <div className="flex gap-6 text-xs text-white/60 font-body">
              {NAV_LINKS.map(link => (
                <a key={link.label} href="#"
                  onClick={(e) => { e.preventDefault(); go(link.view); }}
                  className="hover:text-white/90 transition-colors">
                  {link.label}
                </a>
              ))}
            </div>

            <div className="text-xs text-white/50 font-body text-right">
              hello@izinix.com · US · CA · EU · AU · ME
            </div>
          </div>

          <div className="mt-8 pt-6 border-t border-white/5 flex justify-between text-[11px] text-white/30 font-body">
            <span>Complexity is a choice. Now it's yours to end.</span>
            <span>© 2025 IZINIX. All rights reserved.</span>
          </div>
        </footer>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       Five Pillars data
       ════════════════════════════════════════════════════════════════════════ */
    const PILLARS = [
      { icon: 'automation', codename: 'Autocore',  label: 'AI Automation',
        body: 'Replace manual workflows with intelligent systems that run without you.' },
      { icon: 'browser',    codename: 'Webframe',  label: 'Web Design & Development',
        body: "Interfaces your clients remember and your competitors can't replicate." },
      { icon: 'smartphone', codename: 'Appstack',  label: 'Mobile App Development',
        body: 'Mobile experiences engineered for retention, speed, and scale.' },
      { icon: 'server',     codename: 'Infraset',  label: 'Custom Software Engineering',
        body: 'Backend architecture that handles enterprise load without enterprise bloat.' },
      { icon: 'megaphone',  codename: 'Outpost',   label: 'Social Media Management',
        body: 'Social content built to precision brand standards — produced at volume.' },
    ];

    function PillarCard({ pillar }) {
      return (
        <div className="liquid-glass rounded-[1.25rem] p-6 min-h-[280px] flex flex-col">
          <div className="liquid-glass w-11 h-11 rounded-[0.75rem] flex items-center justify-center flex-shrink-0">
            <PillarIcon path={PILLAR_ICON_PATHS[pillar.icon]} className="h-6 w-6 text-white" />
          </div>
          <div className="flex-1" />
          <div>
            <div className="text-xs text-white/50 font-body uppercase tracking-wide mt-1">
              {pillar.label}
            </div>
            <h3 className="font-heading italic text-white text-3xl tracking-[-1px] leading-none mt-1">
              {pillar.codename}
            </h3>
            <p className="mt-3 text-sm text-white/80 font-body font-light leading-snug max-w-[32ch]">
              {pillar.body}
            </p>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       HOME page
       ════════════════════════════════════════════════════════════════════════ */
    function Home({ go }) {
      return (
        <>
          {/* ── Hero ─────────────────────────────────────────────────────── */}
          <section className="relative min-h-screen flex flex-col overflow-hidden">
            <div className="relative z-10 flex-1 flex flex-col items-center justify-center pt-24 px-4">

              <motion.div {...fu(0.4)}
                className="liquid-glass rounded-full flex items-center gap-2 px-2 py-1.5 mb-6">
                <span className="bg-white text-black px-3 py-1 rounded-full text-xs font-semibold font-body">
                  New
                </span>
                <span className="text-sm text-white/90 font-body pr-3">
                  Where complexity ends.
                </span>
              </motion.div>

              <BlurText
                text="Intelligent Systems. Executed without Friction."
                className="text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.9] max-w-3xl justify-center tracking-[-3px]"
              />

              <motion.p {...fu(0.9)}
                className="mt-4 text-sm md:text-base text-white/90 max-w-2xl font-body font-light leading-relaxed text-center">
                We design, automate, and engineer the infrastructure that scales your

              </motion.p>

              <motion.div {...fu(1.1)} className="flex items-center gap-6 mt-6">
                <button onClick={() => go('contact')}
                  className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-white flex items-center gap-2 font-body cursor-pointer">
                  Let's Build
                  <ArrowUpRight className="h-5 w-5" />
                </button>
                <button onClick={() => go('use-cases')}
                  className="text-white text-sm font-body font-medium flex items-center gap-2 cursor-pointer bg-transparent border-0">
                  See What We've Built
                  <ArrowDown className="h-4 w-4" />
                </button>
              </motion.div>
            </div>
          </section>

          {/* ── Statement ────────────────────────────────────────────────── */}
          <section className="relative z-10 mt-32 px-4 flex flex-col items-center text-center max-w-3xl mx-auto">
            <BlurText
              text="Every inefficiency in your business has a structural cause. We find it. We eliminate it."
              className="font-heading italic text-white text-4xl md:text-5xl leading-tight tracking-[-1px]"
            />
            <motion.p {...fu(0.4)} className="mt-6 text-white/70 font-body font-light text-lg">
              From First Call to Live in Weeks
            </motion.p>
          </section>

          {/* ── Five Pillars ─────────────────────────────────────────────── */}
          <section className="relative z-10 mt-32 px-8 md:px-16 lg:px-20">
            <motion.p {...fu(0.1)} className="text-sm font-body text-white/60 mb-4">// The Matrix</motion.p>
            <BlurText
              text="Deployed independently or as a unified operating system."
              className="font-heading italic text-white text-4xl md:text-5xl tracking-[-1px] mb-16 justify-start text-left"
            />

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {PILLARS.slice(0, 3).map(p => <PillarCard key={p.codename} pillar={p} />)}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
              {PILLARS.slice(3).map(p => <PillarCard key={p.codename} pillar={p} />)}
            </div>
          </section>

          {/* ── Closing CTA ──────────────────────────────────────────────── */}
          <section className="relative z-10 mt-32 px-4 flex flex-col items-center text-center">
            <BlurText
              text="We fix the systems holding you back."
              className="font-heading italic text-white text-5xl md:text-6xl leading-tight tracking-[-2px] text-center"
            />
            <motion.button {...fu(0.4)} onClick={() => go('contact')}
              className="liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white mt-8 flex items-center gap-2 font-body cursor-pointer">
              Start the Conversation
              <ArrowUpRight className="h-5 w-5" />
            </motion.button>
          </section>
        </>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       USE CASES page
       ════════════════════════════════════════════════════════════════════════ */
    const SCENARIOS = [
      {
        tag: 'AI Automation',
        headline: 'Your operation runs on effort where it should run on automation.',
        before: 'Three People. One Spreadsheet. Every Monday. Every Week. Every Year. There’s a better way to run a business.',
        after: 'We build one system that sees everything. Routes it, approves it, flags it, reports it — before anyone has to ask.',
        outcome: '— Operational overhead cut. Decision cycles compressed.',
      },
      {
        tag: 'Web · App · Software Engineering',
        headline: "Five Styles. Three Fonts. Zero Consistency. That's not a website — that's a first impression you can't take back.",
        before: "Why does your website feel different from your app? Why do users drop off the moment they switch screens? Why does every sprint include a round of design fixes? Because there's no single system behind the product.",
        after: 'One system. One standard. Every screen. Web, app, and dashboard speaking the same visual language. The product speaks for itself — because it finally speaks as one.',
        outcome: '— Cohesive digital infrastructure. Retention that compounds.',
      },
      {
        tag: 'Social Media',
        headline: "Different tone every post. That's not a brand. That's a guess.",
        before: 'Late approvals. Rewritten briefs. Missed deadlines. A different voice every week. Output is low. Quality is lower.',
        after: 'One voice. One system. Every platform. Content ships on time — every time. Your brand stops coasting. It starts compounding.',
        outcome: '— High-volume output. Consistent brand authority.',
      },
    ];

    function ScenarioBlock({ scenario }) {
      return (
        <div className="mt-24 max-w-4xl mx-auto px-4">
          <motion.div {...fu(0.1)} className="liquid-glass rounded-full px-3.5 py-1 inline-block mb-4">
            <span className="text-xs font-medium text-white/80 font-body">{scenario.tag}</span>
          </motion.div>

          <BlurText
            text={scenario.headline}
            className="font-heading italic text-white text-4xl md:text-5xl tracking-[-1px] justify-start text-left"
          />

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
            <motion.div {...fu(0.2)} className="liquid-glass rounded-[1.25rem] p-6">
              <div className="text-xs text-white/50 uppercase tracking-wide mb-3 font-body">Before IZINIX</div>
              <p className="text-white/80 font-body font-light leading-snug">{scenario.before}</p>
            </motion.div>
            <motion.div {...fu(0.3)} className="liquid-glass rounded-[1.25rem] p-6">
              <div className="text-xs text-white/50 uppercase tracking-wide mb-3 font-body">After IZINIX</div>
              <p className="text-white/80 font-body font-light leading-snug">{scenario.after}</p>
            </motion.div>
          </div>

          <motion.p {...fu(0.4)} className="mt-6 text-white/60 font-body text-sm italic">
            {scenario.outcome}
          </motion.p>
        </div>

    }

    function UseCases({ go }) {
      return (
        <>
          <section className="relative z-10 pt-32 px-4 flex flex-col items-center text-center max-w-3xl mx-auto">
            <BlurText
              text="This Is What Operational Transformation Looks Like."
              className="font-heading italic text-white text-5xl md:text-6xl leading-tight tracking-[-2px]"
            />
            <motion.p {...fu(0.4)} className="mt-4 text-white/70 font-body font-light text-lg">
              Three scenarios. The same outcome: friction gone.
            </motion.p>
          </section>

          {SCENARIOS.map((s, i) => <ScenarioBlock key={i} scenario={s} />)}

          <section className="relative z-10 mt-32 px-4 flex flex-col items-center text-center">
            <BlurText
              text="Recognize your business in any of these?"
              className="font-heading italic text-white text-4xl md:text-5xl tracking-[-1px]"
            />
            <motion.button {...fu(0.3)} onClick={() => go('contact')}
              className="liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white mt-6 flex items-center gap-2 font-body cursor-pointer">
              Let's Get Started
              <ArrowUpRight className="h-5 w-5" />
            </motion.button>
            <motion.p {...fu(0.5)} className="mt-3 text-xs text-white/50 font-body">
              Let's Build Something That Grows You
            </motion.p>
          </section>
        </>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       CONTACT page
       ════════════════════════════════════════════════════════════════════════ */
    const SERVICE_OPTIONS = [
      'AI Automation', 'Web Design', 'App Design',
      'Software Engineering', 'Social Media', 'All of the above',
    ];

    function Contact() {
      const [form, setForm] = useState({ name: '', company: '', role: '', challenge: '' });
      const [services, setServices] = useState([]);
      const [sent, setSent] = useState(false);

      const field = (key) => (e) => setForm({ ...form, [key]: e.target.value });

      const toggleService = (opt) => {
        setServices(cur => cur.includes(opt) ? cur.filter(s => s !== opt) : [...cur, opt]);
      };

      const inputCls = "liquid-glass bg-white/[0.02] rounded-xl px-4 py-3 text-white text-sm font-body placeholder:text-white/30 outline-none w-full";

      return (
        <>
          <section className="relative z-10 pt-32 px-4 flex flex-col items-center text-center">
            <BlurText
              text="Start Here."
              className="font-heading italic text-white text-5xl md:text-6xl tracking-[-2px]"
            />
            <motion.p {...fu(0.4)} className="mt-4 text-white/70 font-body font-light text-lg max-w-xl mx-auto text-center">
              Tell us where the friction lives. We'll tell you how to remove it — in the first conversation.
            </motion.p>
          </section>

          <motion.section {...fu(0.5)} className="relative z-10 max-w-2xl mx-auto mt-16 px-4">
            <div className="liquid-glass rounded-[1.5rem] p-8 md:p-10">
              <div className="flex flex-col gap-6">
                <div>
                  <label className="text-xs text-white/50 uppercase tracking-wide font-body mb-2 block">Full Name</label>
                  <input className={inputCls} placeholder="Your name" value={form.name} onChange={field('name')} />
                </div>
                <div>
                  <label className="text-xs text-white/50 uppercase tracking-wide font-body mb-2 block">Company</label>
                  <input className={inputCls} placeholder="Where do you work?" value={form.company} onChange={field('company')} />
                </div>
                <div>
                  <label className="text-xs text-white/50 uppercase tracking-wide font-body mb-2 block">Role</label>
                  <input className={inputCls} placeholder="What's your function?" value={form.role} onChange={field('role')} />
                </div>
                <div>
                  <label className="text-xs text-white/50 uppercase tracking-wide font-body mb-2 block">Primary Challenge</label>
                  <textarea rows={4} className={inputCls} placeholder="Describe the problem in plain terms." value={form.challenge} onChange={field('challenge')} />
                </div>
                <div>
                  <label className="text-xs text-white/50 uppercase tracking-wide font-body mb-2 block">Services of Interest</label>
                  <div className="flex flex-wrap gap-2">
                    {SERVICE_OPTIONS.map(opt => {
                      const active = services.includes(opt);
                      return (
                        <button key={opt} type="button" onClick={() => toggleService(opt)}
                          className={`liquid-glass rounded-full px-3.5 py-1.5 text-xs font-medium font-body cursor-pointer transition-colors ${active ? 'bg-white text-black' : 'text-white/80'}`}>
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button onClick={() => setSent(true)}
                  className="liquid-glass-strong rounded-full py-3 text-sm font-medium text-white mt-2 flex items-center justify-center gap-2 font-body cursor-pointer w-full">
                  {sent ? 'Sent — We\'ll Be in Touch' : "Send It"}
                  <ArrowUpRight className="h-5 w-5" />
                </button>
              </div>
            </div>
          </motion.section>
        </>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       App root — simple client-side router (home / use-cases / contact)
       ════════════════════════════════════════════════════════════════════════ */
    function App() {
      const [view, setView] = useState('home');

      const go = (next) => {
        setView(next);
        window.scrollTo(0, 0);
      };

      return (
        <>
          <GlassField />
          <div className="relative z-10">
            <Navbar view={view} go={go} />
            {view === 'home' && <Home go={go} />}
            {view === 'use-cases' && <UseCases go={go} />}
            {view === 'contact' && <Contact />}
            <Footer go={go} />
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
